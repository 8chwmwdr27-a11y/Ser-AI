<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ser-AI | ELITE ENGINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;400;700&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --accent: #ffffff;
            --secondary: #1d1d1f;
            --text-muted: #86868b;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --neon: #0071e3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Inter', 'Assistant', sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Welcome Screen */
        #welcome-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            z-index: 5;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .welcome-logo {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 5px;
            margin-bottom: 15px;
            background: linear-gradient(to bottom, #fff, #444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: logoPulse 3s infinite ease-in-out;
        }

        .welcome-sub { color: var(--text-muted); font-size: 1rem; letter-spacing: 2px; opacity: 0; animation: fadeIn 1.5s forwards 0.5s; }

        @keyframes logoPulse {
            0%, 100% { opacity: 0.8; filter: blur(0px); }
            50% { opacity: 1; filter: blur(1px); transform: scale(1.02); }
        }
        @keyframes fadeIn { to { opacity: 1; } }

        .hidden-welcome { opacity: 0 !important; transform: translate(-50%, -60%) !important; pointer-events: none; }

        /* UI Elements */
        nav { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 10; background: var(--bg); }
        .brand { font-weight: 700; letter-spacing: 2px; font-size: 0.9rem; text-transform: uppercase; }
        .status { font-size: 0.7rem; display: flex; align-items: center; gap: 10px; color: var(--text-muted); }
        .status-dot { width: 6px; height: 6px; background: #34c759; border-radius: 50%; box-shadow: 0 0 8px #34c759; }

        #chat-flow { flex: 1; overflow-y: auto; padding: 40px 15%; display: flex; flex-direction: column; gap: 32px; scroll-behavior: smooth; }

        .msg-wrapper { width: 100%; display: flex; flex-direction: column; opacity: 0; transform: translateY(15px); animation: appear 0.6s forwards; }
        @keyframes appear { to { opacity: 1; transform: translateY(0); } }

        .user-msg { align-items: flex-end; }
        .user-bubble { background: var(--accent); color: black; padding: 12px 24px; border-radius: 20px; font-weight: 500; font-size: 0.95rem; max-width: 80%; }
        
        .ai-msg { align-items: flex-start; }
        .ai-label { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 700; letter-spacing: 1px; }
        .ai-text { line-height: 1.8; font-size: 1.05rem; max-width: 90%; color: #f5f5f7; white-space: pre-wrap; }

        /* Thinking & Interaction */
        .thinking-container { margin-bottom: 20px; padding: 15px; background: var(--glass); border: 1px solid var(--border); border-radius: 12px; font-size: 0.8rem; color: var(--text-muted); display: none; }
        .thought-line { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .thought-line span { width: 10px; height: 1px; background: var(--neon); }

        .interaction-area { padding: 30px 15%; background: linear-gradient(to top, var(--bg) 80%, transparent); position: sticky; bottom: 0; }
        .input-bar { background: var(--secondary); border: 1px solid var(--border); border-radius: 18px; padding: 8px 12px; display: flex; align-items: center; gap: 15px; }
        input { flex: 1; background: transparent; border: none; color: white; font-size: 1rem; outline: none; padding: 10px; }
        .action-btn { background: var(--accent); color: black; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }

        /* Admin Drawer */
        .drawer { position: fixed; bottom: -100%; left: 0; width: 100%; height: 70vh; background: #111; z-index: 100; transition: 0.5s cubic-bezier(0.32, 0.72, 0, 1); border-top: 1px solid var(--border); padding: 30px; border-radius: 30px 30px 0 0; }
        .drawer.open { bottom: 0; }
        textarea { width: 100%; height: 70%; background: #000; color: #0071e3; border: 1px solid var(--border); padding: 15px; border-radius: 12px; font-family: monospace; resize: none; margin-top: 15px; }

        @media (max-width: 768px) { #chat-flow, .interaction-area { padding: 20px 5%; } }
    </style>
</head>
<body>

    <nav>
        <div class="brand">ser-AI <span>ELITE</span></div>
        <div class="status">
            <span onclick="toggleDrawer()" style="cursor:pointer; border-bottom: 1px solid #444;">CORE ENGINE</span>
            <div class="status-dot"></div>
        </div>
    </nav>

    <div id="welcome-screen">
        <div class="welcome-logo">ser-AI</div>
        <div class="welcome-sub">SYSTEM CORE ONLINE</div>
    </div>

    <main id="chat-flow"></main>

    <div class="interaction-area">
        <div id="thinking" class="thinking-container">
            <div class="thought-line"><span></span> ניתוח רבדי שפה ורגש...</div>
            <div class="thought-line"><span></span> סנכרון עם הליבה המרכזית...</div>
        </div>
        <div class="input-bar">
            <input type="text" id="userInput" placeholder="שלח פקודה לליבה..." autocomplete="off">
            <button class="action-btn" id="sendBtn" onclick="execute()">↑</button>
        </div>
    </div>

    <div class="drawer" id="adminDrawer">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="letter-spacing: 1px;">עריכת ליבת ה-SELF</h3>
            <button onclick="toggleDrawer()" style="background: none; border: none; color: white; cursor: pointer;">✕</button>
        </div>
        <textarea id="coreInput" placeholder="// הכנס כאן את הלוגיקה, השפה והרגש של ser-AI..."></textarea>
        <button onclick="saveCore()" style="margin-top: 15px; width: 100%; padding: 15px; background: white; color: black; border: none; border-radius: 12px; font-weight: bold; cursor: pointer;">צריבת נתונים לליבה</button>
    </div>

    <script>
        const chatFlow = document.getElementById('chat-flow');
        const thinking = document.getElementById('thinking');
        const welcomeScreen = document.getElementById('welcome-screen');
        const coreInput = document.getElementById('coreInput');
        
        let isFirstMessage = true;
        let chatHistory = []; // שומר על הקשר השיחה

        // טעינת הליבה מהזיכרון בטעינת הדף
        window.onload = () => {
            const savedCore = localStorage.getItem('serEliteCore');
            if(savedCore) coreInput.value = savedCore;
        };

        function toggleDrawer() {
            document.getElementById('adminDrawer').classList.toggle('open');
        }

        function saveCore() {
            localStorage.setItem('serEliteCore', coreInput.value);
            alert("הליבה עודכנה בהצלחה.");
            toggleDrawer();
        }

        async function execute() {
    const input = document.getElementById('userInput');
    const userText = input.value.trim();
    if(!userText) return;

    // --- כאן תדביק את המפתח החדש שלך בתוך המרכאות ---
    const API_KEY = "AIzaSyCUHKvlH4xNBv9TI4k0PlltHzdFH4xsb4U"; 
    // ----------------------------------------------

    if(isFirstMessage) {
        if(document.getElementById('welcome-hero')) {
            document.getElementById('welcome-hero').style.display = 'none';
        }
        isFirstMessage = false;
    }

    // הצגת הודעת משתמש
    chatFlow.innerHTML += `
        <div class="msg-wrapper user-msg">
            <div class="user-bubble">${userText}</div>
        </div>`;
    
    input.value = '';
    thinking.style.display = 'block';
    chatFlow.scrollTop = chatFlow.scrollHeight;

    // שאיבת הליבה מה-Admin (ה-Self שלך)
    const CORE_LOGIC = localStorage.getItem('serAiCore') || "You are ser-AI, an elite AI assistant.";

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [
                    { role: "user", parts: [{ text: "SYSTEM_CORE: " + CORE_LOGIC }] },
                    ...chatHistory,
                    { role: "user", parts: [{ text: userText }] }
                ]
            })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const aiResponse = data.candidates[0].content.parts[0].text;

        // שמירה לזיכרון של השיחה
        chatHistory.push({ role: "user", parts: [{ text: userText }] });
        chatHistory.push({ role: "model", parts: [{ text: aiResponse }] });

        thinking.style.display = 'none';
        const aiId = 'ai_' + Date.now();
        
        chatFlow.innerHTML += `
            <div class="msg-wrapper ai-msg">
                <div class="ai-label">ser-AI ELITE</div>
                <div class="ai-text" id="${aiId}"></div>
            </div>`;

        typeEffect(aiId, aiResponse);
        chatFlow.scrollTop = chatFlow.scrollHeight;

    } catch (error) {
        thinking.style.display = 'none';
        console.error("Error:", error);
        chatFlow.innerHTML += `<div class="msg-wrapper ai-msg"><div class="ai-text" style="color:#ff4b4b">שגיאה: וודא שהמפתח תקין.</div></div>`;
    }
}

                    <div class="msg-wrapper ai-msg">
                        <div class="ai-label">ser-AI ELITE</div>
                        <div class="ai-text" id="${aiId}"></div>
                    </div>`;

                typeEffect(aiId, aiResponse);

            } catch (error) {
                thinking.style.display = 'none';
                console.error(error);
                chatFlow.innerHTML += `<div class="msg-wrapper ai-msg"><div class="ai-label">SYSTEM</div><div class="ai-text" style="color: #ff453a;">שגיאת ליבה: ${error.message}</div></div>`;
            }
        }

        function typeEffect(id, text) {
            let i = 0;
            const el = document.getElementById(id);
            const interval = setInterval(() => {
                el.textContent += text.charAt(i);
                i++;
                if (i >= text.length) clearInterval(interval);
                chatFlow.scrollTop = chatFlow.scrollHeight;
            }, 10);
        }

        document.getElementById('userInput').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') execute();
        });
    </script>
</body>
</html>
