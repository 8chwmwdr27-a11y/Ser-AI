<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ser-AI | ELITE ENGINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;400;700&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --accent: #ffffff;
            --secondary: #1d1d1f;
            --text-muted: #86868b;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --neon: #0071e3;
        }

        /* נעילת מסך למניעת תזוזה וזום */
        html, body { 
            margin: 0; padding: 0; box-sizing: border-box; 
            overflow: hidden; height: 100%; width: 100%;
            position: fixed; touch-action: none;
            background-color: var(--bg); color: white;
            font-family: 'Inter', 'Assistant', sans-serif;
        }

        body { display: flex; flex-direction: column; }

        /* UI */
        nav { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 10; }
        .brand { font-weight: 700; letter-spacing: 2px; font-size: 0.9rem; }
        
        #chat-flow { 
            flex: 1; overflow-y: auto; padding: 20px; 
            display: flex; flex-direction: column; gap: 20px;
            touch-action: pan-y; /* מאפשר גלילה רק למעלה-למטה בצ'אט */
        }

        .user-bubble { background: var(--accent); color: black; padding: 12px 18px; border-radius: 15px; align-self: flex-end; max-width: 80%; }
        .ai-text { color: #f5f5f7; line-height: 1.6; align-self: flex-start; max-width: 90%; white-space: pre-wrap; }

        .interaction-area { padding: 20px; border-top: 1px solid var(--border); background: var(--bg); }
        .input-bar { background: var(--secondary); border-radius: 25px; padding: 5px 15px; display: flex; align-items: center; }
        input { flex: 1; background: transparent; border: none; color: white; padding: 12px; outline: none; font-size: 16px; }
        
        .action-btn { background: var(--accent); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-weight: bold; }

        /* Welcome */
        #welcome-screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; transition: 0.5s; }
        .hidden { opacity: 0; visibility: hidden; }

        /* Drawer */
        .drawer { position: fixed; bottom: -100%; left: 0; width: 100%; height: 70vh; background: #111; z-index: 100; transition: 0.4s; padding: 20px; border-top: 1px solid var(--border); }
        .drawer.open { bottom: 0; }
        textarea { width: 100%; height: 50%; background: #000; color: var(--neon); border: 1px solid var(--border); padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>

    <nav>
        <div class="brand">ser-AI ELITE</div>
        <div onclick="toggleDrawer()" style="cursor:pointer; color:var(--text-muted); font-size: 0.7rem;">CORE ENGINE ●</div>
    </nav>

    <div id="welcome-screen">
        <h1 style="letter-spacing: 5px;">ser-AI</h1>
        <p style="color: var(--text-muted);">READY FOR COMMAND</p>
    </div>

    <main id="chat-flow"></main>

    <div class="interaction-area">
        <div id="thinking" style="display:none; color:var(--text-muted); font-size:0.7rem; margin-bottom:10px;">מעבד נתונים...</div>
        <div class="input-bar">
            <input type="text" id="userInput" placeholder="הקש פקודה..." autocomplete="off">
            <button class="action-btn" id="sendBtn">↑</button>
        </div>
    </div>

    <div class="drawer" id="adminDrawer">
        <h3>SYSTEM CORE</h3>
        <textarea id="coreInput"></textarea>
        <button onclick="saveCore()" style="width:100%; padding:15px; background:white; border:none; font-weight:bold;">SAVE CORE</button>
        <button onclick="toggleDrawer()" style="width:100%; margin-top:10px; background:transparent; color:white; border:none;">CLOSE</button>
    </div>

    <script>
        const chatFlow = document.getElementById('chat-flow');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const thinking = document.getElementById('thinking');
        const welcome = document.getElementById('welcome-screen');
        const adminDrawer = document.getElementById('adminDrawer');
        const coreInput = document.getElementById('coreInput');

        let chatHistory = [];

        // טעינת הגדרות ליבה
        window.onload = () => {
            coreInput.value = localStorage.getItem('serEliteCore') || "You are ser-AI, an elite AI assistant.";
        };

        function toggleDrawer() {
            adminDrawer.classList.toggle('open');
        }

        function saveCore() {
            localStorage.setItem('serEliteCore', coreInput.value);
            alert("Core Updated");
            toggleDrawer();
        }

        // פונקציית הביצוע המרכזית
        async function execute() {
            const text = userInput.value.trim();
            if (!text) return;

            // המפתח שלך (וודא שהוא בתוקף!)
            const API_KEY = "AIzaSyCUHKvlH4xNBv9TI4k0PlltHzdFH4xsb4U";

            // הסרת מסך הפתיחה
            welcome.classList.add('hidden');

            // הצגת הודעת משתמש
            chatFlow.innerHTML += `<div class="user-bubble">${text}</div>`;
            userInput.value = '';
            thinking.style.display = 'block';
            chatFlow.scrollTop = chatFlow.scrollHeight;

            try {
                const core = localStorage.getItem('serEliteCore') || "";
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            { role: "user", parts: [{ text: "SYSTEM_INSTRUCTION: " + core }] },
                            ...chatHistory,
                            { role: "user", parts: [{ text: text }] }
                        ]
                    })
                });

                const data = await response.json();
                const aiResponse = data.candidates[0].content.parts[0].text;

                // עדכון היסטוריה
                chatHistory.push({ role: "user", parts: [{ text: text }] });
                chatHistory.push({ role: "model", parts: [{ text: aiResponse }] });

                thinking.style.display = 'none';
                
                // הדפסת תשובה
                const aiDiv = document.createElement('div');
                aiDiv.className = 'ai-text';
                chatFlow.appendChild(aiDiv);
                
                // אפקט הקלדה פשוט
                let i = 0;
                const type = setInterval(() => {
                    aiDiv.textContent += aiResponse.charAt(i);
                    i++;
                    if (i >= aiResponse.length) clearInterval(type);
                    chatFlow.scrollTop = chatFlow.scrollHeight;
                }, 10);

            } catch (err) {
                thinking.style.display = 'none';
                chatFlow.innerHTML += `<div style="color:red">ERROR: Connection Failed</div>`;
            }
        }

        // חיבור אירועים (Event Listeners) - הדרך הבטוחה ביותר
        sendBtn.addEventListener('click', execute);
        
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') execute();
        });
    </script>
</body>
</html>
